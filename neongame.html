<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Pong</title>
<style>
  :root{
    --bg:#0a0a14;
    --blue:#3ec6ff;
    --purple:#a259ff;
    --gold:#ffd166;
    --text:#e8e8f0;
    --dim:#6a6a80;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:radial-gradient(ellipse at center, #0d0d1a 0%, #060609 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Courier New', Consolas, monospace;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:min(92vw, 508px);
    aspect-ratio:508/612;
    border-radius:22px;
    padding:3px;
    background:linear-gradient(135deg, var(--blue), var(--purple) 55%, var(--gold));
    box-shadow:0 0 40px rgba(120,80,255,0.25);
  }
  .inner{
    position:relative;
    width:100%;
    height:100%;
    border-radius:20px;
    background:var(--bg);
    overflow:hidden;
  }
  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
  }
  .hint{
    position:absolute;
    bottom:10px;
    left:0;
    right:0;
    text-align:center;
    color:var(--dim);
    font-size:11px;
    letter-spacing:1px;
    pointer-events:none;
    user-select:none;
  }
  .msg{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    background:rgba(6,6,10,0.72);
    color:var(--text);
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .msg.show{ opacity:1; pointer-events:auto; }
  .msg h1{
    margin:0;
    font-size:22px;
    letter-spacing:2px;
    text-shadow:0 0 12px currentColor;
  }
  .msg p{ margin:0; color:var(--dim); font-size:12px; letter-spacing:1px; }
  .msg button{
    margin-top:6px;
    padding:10px 22px;
    background:transparent;
    border:1px solid var(--blue);
    color:var(--blue);
    border-radius:8px;
    font-family:inherit;
    letter-spacing:2px;
    font-size:12px;
    cursor:pointer;
    box-shadow:0 0 10px rgba(62,198,255,0.4);
  }
  .msg button:active{ transform:scale(0.97); }
</style>
</head>
<body>
<div class="stage">
  <div class="inner">
    <canvas id="game"></canvas>
    <div class="hint">DRAG / MOUSE / ARROWS TO MOVE</div>
    <div class="msg show" id="overlay">
      <h1 style="color:var(--blue)">NEON PONG</h1>
      <p>FIRST TO 7 WINS</p>
      <button id="startBtn">START</button>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  const COLORS = {
    blue: '#3ec6ff',
    purple: '#a259ff',
    white: '#f4f6ff',
    dim: '#4a4a5c',
    line: '#33334a'
  };

  let W, H, DPR;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
  }

  let player, cpu, ball;
  const PADDLE_W_RATIO = 0.014;
  const PADDLE_H_RATIO = 0.16;
  const BALL_R_RATIO = 0.016;

  function layout(){
    const pw = Math.max(6, W*PADDLE_W_RATIO);
    const ph = H*PADDLE_H_RATIO;
    const margin = W*0.07;
    if(!player){
      player = {x:margin, y:H/2-ph/2, w:pw, h:ph, speed:0};
      cpu = {x:W-margin-pw, y:H/2-ph/2, w:pw, h:ph, speed:0};
      ball = {x:W/2, y:H/2, r:Math.max(6,W*BALL_R_RATIO), vx:0, vy:0};
      resetBall(1);
    } else {
      player.x = margin; player.w = pw; player.h = ph;
      cpu.x = W-margin-pw; cpu.w = pw; cpu.h = ph;
      ball.r = Math.max(6,W*BALL_R_RATIO);
    }
  }

  let scoreYou = 0, scoreCpu = 0;
  let running = false;
  let baseSpeed;

  function resetBall(dir){
    baseSpeed = W*0.006 + 2.2;
    ball.x = W/2; ball.y = H/2;
    const angle = (Math.random()*0.6 - 0.3);
    ball.vx = Math.cos(angle) * baseSpeed * dir;
    ball.vy = Math.sin(angle) * baseSpeed;
  }

  // Player control
  let targetY = null;
  function setPlayerTarget(clientY){
    const rect = canvas.getBoundingClientRect();
    const y = clientY - rect.top;
    targetY = y - player.h/2;
  }
  canvas.addEventListener('mousemove', e=>{ setPlayerTarget(e.clientY); });
  canvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(e.touches[0]) setPlayerTarget(e.touches[0].clientY);
  }, {passive:false});
  canvas.addEventListener('touchstart', e=>{
    if(e.touches[0]) setPlayerTarget(e.touches[0].clientY);
  });

  const keys = {};
  window.addEventListener('keydown', e=>{
    if(['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key)) e.preventDefault();
    keys[e.key]=true;
  });
  window.addEventListener('keyup', e=>{ keys[e.key]=false; });

  function updatePlayer(){
    const kSpeed = H*0.012+4;
    if(keys['ArrowUp']||keys['w']||keys['W']) player.y -= kSpeed;
    if(keys['ArrowDown']||keys['s']||keys['S']) player.y += kSpeed;
    if(targetY !== null){
      const dy = targetY - player.y;
      player.y += dy * 0.35;
    }
    player.y = Math.max(0, Math.min(H-player.h, player.y));
  }

  function updateCpu(){
    const center = cpu.y + cpu.h/2;
    const diff = ball.y - center;
    const maxSpeed = H*0.0085 + 2.6;
    const easing = ball.vx > 0 ? 0.12 : 0.05; // reacts better when ball coming toward it
    let move = diff * easing;
    move = Math.max(-maxSpeed, Math.min(maxSpeed, move));
    cpu.y += move;
    cpu.y = Math.max(0, Math.min(H-cpu.h, cpu.y));
  }

  function updateBall(){
    ball.x += ball.vx;
    ball.y += ball.vy;

    if(ball.y - ball.r < 0){ ball.y = ball.r; ball.vy *= -1; }
    if(ball.y + ball.r > H){ ball.y = H-ball.r; ball.vy *= -1; }

    // player paddle
    if(ball.vx < 0 && ball.x - ball.r < player.x + player.w &&
       ball.x - ball.r > player.x - 20 &&
       ball.y > player.y && ball.y < player.y + player.h){
      ball.x = player.x + player.w + ball.r;
      const hit = (ball.y - (player.y+player.h/2)) / (player.h/2);
      const speed = Math.min(Math.hypot(ball.vx,ball.vy)*1.06, baseSpeed*2.4);
      const angle = hit * 0.9;
      ball.vx = Math.cos(angle)*speed;
      ball.vy = Math.sin(angle)*speed;
    }

    // cpu paddle
    if(ball.vx > 0 && ball.x + ball.r > cpu.x &&
       ball.x + ball.r < cpu.x + cpu.w + 20 &&
       ball.y > cpu.y && ball.y < cpu.y + cpu.h){
      ball.x = cpu.x - ball.r;
      const hit = (ball.y - (cpu.y+cpu.h/2)) / (cpu.h/2);
      const speed = Math.min(Math.hypot(ball.vx,ball.vy)*1.06, baseSpeed*2.4);
      const angle = Math.PI - hit*0.9;
      ball.vx = Math.cos(angle)*speed;
      ball.vy = Math.sin(angle)*speed;
    }

    if(ball.x < -30){ scoreCpu++; onScore(); }
    if(ball.x > W+30){ scoreYou++; onScore(); }
  }

  function onScore(){
    if(scoreYou>=7 || scoreCpu>=7){
      running = false;
      showOverlay(scoreYou>=7 ? 'YOU WIN' : 'CPU WINS', scoreYou>=7?COLORS.blue:COLORS.purple, true);
      return;
    }
    resetBall(Math.random()<0.5?1:-1);
  }

  function showOverlay(title, color, isEnd){
    overlay.innerHTML = `<h1 style="color:${color}">${title}</h1>
      <p>${isEnd? 'SCORE '+scoreYou+' - '+scoreCpu : 'FIRST TO 7 WINS'}</p>
      <button id="startBtn" style="border-color:${color};color:${color};box-shadow:0 0 10px ${color}66">${isEnd?'PLAY AGAIN':'START'}</button>`;
    overlay.classList.add('show');
    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  function startGame(){
    if(overlay.querySelector('h1').textContent.includes('WIN')){
      scoreYou = 0; scoreCpu = 0;
    }
    overlay.classList.remove('show');
    resetBall(Math.random()<0.5?1:-1);
    running = true;
  }
  startBtn.addEventListener('click', startGame);

  function drawDigit(n, x, y, color){
    ctx.fillStyle = color;
    ctx.font = '700 26px Consolas, "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = color;
    ctx.shadowBlur = 14;
    ctx.fillText(String(n), x, y);
    ctx.shadowBlur = 0;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // center dashed line
    ctx.strokeStyle = COLORS.line;
    ctx.lineWidth = 2;
    ctx.setLineDash([6,8]);
    ctx.beginPath();
    ctx.moveTo(W/2, H*0.14);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // scores
    drawDigit(scoreYou, W*0.25, H*0.075, COLORS.white);
    drawDigit(scoreCpu, W*0.75, H*0.075, COLORS.purple);

    ctx.font = '600 10px Consolas, monospace';
    ctx.shadowBlur = 0;
    ctx.fillStyle = COLORS.dim;
    ctx.textAlign='center';
    ctx.fillText('YOU', W*0.25, H*0.115);
    ctx.fillStyle = '#8a6fd8';
    ctx.fillText('CPU', W*0.75, H*0.115);

    // paddles
    drawPaddle(player, COLORS.blue);
    drawPaddle(cpu, COLORS.purple);

    // ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r*3.2, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = COLORS.white;
    ctx.shadowColor = COLORS.white;
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawPaddle(p, color){
    const r = p.w/2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y+r);
    ctx.arcTo(p.x, p.y, p.x+r, p.y, r);
    ctx.arcTo(p.x+p.w, p.y, p.x+p.w, p.y+r, r);
    ctx.lineTo(p.x+p.w, p.y+p.h-r);
    ctx.arcTo(p.x+p.w, p.y+p.h, p.x+r, p.y+p.h, r);
    ctx.arcTo(p.x, p.y+p.h, p.x, p.y+p.h-r, r);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function loop(){
    if(running){
      updatePlayer();
      updateCpu();
      updateBall();
    }
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  loop();
})();
</script>
</body>
</html>
